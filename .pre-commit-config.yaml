# Pre-commit configuration.
#
# Run `pre-commit autoupdate` periodically to refresh the pinned versions.
# The repo's git hook is installed via `pre-commit install`, so any
# `git commit` invokes the hooks listed below.
#
# Tooling
# -------
# Lint + format: ruff through `uv run`, i.e. the version pinned in uv.lock
#                (the upstream hook pinned ruff 0.4.4, whose import sorting
#                disagreed with the project's ruff and flip-flopped fixes).
# Secret scan:   detect-secrets. The .secrets.baseline file lists known-safe
#                pre-existing findings; new commits may not introduce
#                findings outside that baseline.
# Type check:    ty (Astral). Run as a local hook through `uv run ty check`,
#                so it picks up the version pinned in pyproject.toml /
#                uv.lock and stays consistent across contributors.

repos:
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ['--baseline', '.secrets.baseline']
        exclude: package-lock.json

  - repo: local
    hooks:
      - id: ruff
        name: ruff
        entry: uv run ruff check --fix
        language: system
        types: [python]
      - id: ruff-format
        name: ruff-format
        entry: uv run ruff format
        language: system
        types: [python]
      - id: ty
        name: ty
        entry: uv run ty check
        language: system
        types: [python]
        pass_filenames: false
